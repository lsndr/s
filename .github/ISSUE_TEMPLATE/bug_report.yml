name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - '@lsndr/bus'
        - '@lsndr/domain'
        - '@lsndr/logger'
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: 24.0.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Other relevant versions
      description: For example NestJS, the transport (Redis Streams or RabbitMQ) and the Redis or RabbitMQ server.
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: A minimal code sample or a link to a repository that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include error messages and logs.
    validations:
      required: true
