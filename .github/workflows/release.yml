name: Release

on:
  push:
    branches: [main]

env:
  HUSKY: 0

permissions:
  contents: read

# runs push to main, so overlapping ones race and get rejected as non-fast-forward
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
      id-token: write

    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          registry-url: https://npm.pkg.github.com
          cache: npm

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - run: npm ci
      - run: npx nx run-many -t build

      - name: Release
        run: npx nx release --yes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # nx release can't attach files, and the dashboards are not in the
      # published package. The tag points at HEAD only when bus was released.
      - name: Attach the bus dashboards to its release
        run: |
          tag=$(git tag --points-at HEAD --list '@lsndr/bus@*')

          if [ -n "$tag" ]; then
            gh release upload "$tag" packages/bus/dashboards/* --clobber
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
